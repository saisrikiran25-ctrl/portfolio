name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare deploy artifact
        run: |
          mkdir -p _site
          for file in index.html styles.css app.js generator.js scene.js config.example.js; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          cp index.html styles.css app.js generator.js scene.js config.example.js _site/
          for dir in assets img images fonts; do
            if [ -d "$dir" ]; then
              cp -R "$dir" _site/
            fi
          done
          test -f _site/index.html || { echo "Deployment failed: index.html not found in _site"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
